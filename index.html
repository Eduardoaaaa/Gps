                const datasDisponiveis = [...new Set(historicoData.map(item => item.Data))].sort((a, b) => {
                    let [dA, mA, yA] = a.split('/');
                    let [dB, mB, yB] = b.split('/');
                    return new Date(yA, mA - 1, dA) - new Date(yB, mB - 1, dB);
                });

                const aggData = {}; 
                datasDisponiveis.forEach(d => {
                    aggData[d] = { 'ABS Tucuruí': {tt:0, posi:0, fora:0, nao:0}, 'ABS Altamira': {tt:0, posi:0, fora:0, nao:0} };
                });

                historicoData.forEach(row => {
                    if(aggData[row.Data] && aggData[row.Data][row.Unidade]) {
                        aggData[row.Data][row.Unidade].tt += row.Visitas_TT;
                        aggData[row.Data][row.Unidade].posi += row.Visita_Posi;
                        aggData[row.Data][row.Unidade].fora += row.Fora_Visita;
                        aggData[row.Data][row.Unidade].nao += row.Nao_Pediu;
                    }
                });

                function desenharGrafico() {
                    const labelsData = datasDisponiveis;
                    const dadosTucurui = [];
                    const dadosAltamira = [];

                    labelsData.forEach(d => {
                        let t = aggData[d]['ABS Tucuruí'];
                        let prodT = t.tt > 0 ? ((t.posi + t.fora) / t.tt * 100).toFixed(1) : 0;
                        dadosTucurui.push(prodT);

                        let a = aggData[d]['ABS Altamira'];
                        let prodA = a.tt > 0 ? ((a.posi + a.fora) / a.tt * 100).toFixed(1) : 0;
                        dadosAltamira.push(prodA);
                    });

                    const ctx = document.getElementById('graficoEvolucao').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labelsData,
                            datasets: [
                                {
                                    label: 'ABS Tucuruí',
                                    data: dadosTucurui,
                                    backgroundColor: '#3498DB',
                                    borderRadius: 4
                                },
                                {
                                    label: 'ABS Altamira',
                                    data: dadosAltamira,
                                    backgroundColor: '#9B59B6',
                                    borderRadius: 4
                                }
                            ]
                        },
                        options: {
                            layout: {
                                padding: { top: 25 } // Espaço extra para as labels no topo
                            },
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 110, // Maximo 110 para dar espaço ao rótulo superior sem cortar
                                    title: { display: true, text: 'Produtividade Global (%)', font: {weight: 'bold'} }
                                }
                            },
                            plugins: {
                                datalabels: {
                                    anchor: 'end',
                                    align: 'end',
                                    color: '#2c3e50',
                                    font: { weight: 'bold', size: 12 },
                                    formatter: function(value) {
                                        return value + '%';
                                    }
                                },
                                title: {
                                    display: true,
                                    text: 'Evolução Diária da Produtividade por Unidade',
                                    font: { size: 16 }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 32, 96, 0.9)',
                                    titleFont: { size: 14 },
                                    bodyFont: { size: 13 },
                                    padding: 12,
                                    callbacks: {
                                        label: function(context) {
                                            return context.dataset.label + ' - Produtividade: ' + context.parsed.y + '%';
                                        },
                                        afterBody: function(context) {
                                            let idx = context[0].dataIndex;
                                            let datasetIdx = context[0].datasetIndex;
                                            let dataFiltro = labelsData[idx];
                                            let unidade = datasetIdx === 0 ? 'ABS Tucuruí' : 'ABS Altamira';
                                            let d = aggData[dataFiltro][unidade];

                                            return [
                                                '-----------------------',
                                                'Visitas TT: ' + d.tt,
                                                'Visita Posi.: ' + d.posi,
                                                'Fora Visita: ' + d.fora,
                                                'Não Pediu: ' + d.nao
                                            ];
                                        }
                                    }
                                }
                            }
                        }
                    });
                }

                function initUI() {
                    desenharGrafico();
                    
                    const sel = document.getElementById('data_selector');
                    [...datasDisponiveis].reverse().forEach(d => {
                        let opt = document.createElement('option');
                        opt.value = d; opt.innerText = d;
                        sel.appendChild(opt);
                    });
                    
                    if(datasDisponiveis.length > 0) renderizarTabelas();
                }

                function calcPerc(part, total) {
                    if(total === 0) return "0%";
                    return Math.round((part / total) * 100) + "%";
                }

                function renderizarTabelas() {
                    const dataSelecionada = document.getElementById('data_selector').value;
                    const area = document.getElementById('dashboard_area');
                    area.innerHTML = '';
                    
                    const dadosDia = historicoData.filter(d => d.Data === dataSelecionada);
                    
                    if(dadosDia.length === 0) {
                        area.innerHTML = '<div class="no-data">Nenhum dado encontrado para esta data.</div>';
                        return;
                    }
                    
                    const porUnidade = {};
                    dadosDia.forEach(d => {
                        if(!porUnidade[d.Unidade]) porUnidade[d.Unidade] = [];
                        porUnidade[d.Unidade].push(d);
                    });
                    
                    for(const unidade of Object.keys(porUnidade).sort().reverse()) {
                        const rows = porUnidade[unidade];
                        let sumVisitas = 0, sumPosi = 0, sumFora = 0, sumNaoPediu = 0;
                        
                        let tableHTML = `
                        <div class="unidade-section" style="display: block;">
                            <div class="unidade-title">${dataSelecionada}<br>${unidade}</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th class="text-left">Vendedor</th>
                                        <th>Visitas TT</th>
                                        <th colspan="2">Visita Posi.</th>
                                        <th colspan="2">Fora Visita</th>
                                        <th colspan="2">Não Pediu</th>
                                        <th>TT</th>
                                        <th>Produtividade RN</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                        
                        rows.forEach(r => {
                            sumVisitas += r.Visitas_TT;
                            sumPosi += r.Visita_Posi;
                            sumFora += r.Fora_Visita;
                            sumNaoPediu += r.Nao_Pediu;
                            let prodRN = calcPerc((r.Visita_Posi + r.Fora_Visita), r.Visitas_TT);
                            
                            tableHTML += `
                                <tr>
                                    <td class="text-left">${r.Vendedor}</td>
                                    <td>${r.Visitas_TT}</td>
                                    <td class="val-col">${r.Visita_Posi}</td>
                                    <td class="perc-col">${calcPerc(r.Visita_Posi, r.Visitas_TT)}</td>
                                    <td class="val-col">${r.Fora_Visita}</td>
                                    <td class="perc-col">${calcPerc(r.Fora_Visita, r.Visitas_TT)}</td>
                                    <td class="val-col">${r.Nao_Pediu}</td>
                                    <td class="perc-col">${calcPerc(r.Nao_Pediu, r.Visitas_TT)}</td>
                                    <td>${r.Visitas_TT}</td>
                                    <td class="prod-final">${prodRN}</td>
                                </tr>
                            `;
                        });
                        
                        let tProdRN = calcPerc((sumPosi + sumFora), sumVisitas);
                        tableHTML += `
                                </tbody>
                                <tfoot>
                                    <tr class="footer-row">
                                        <td class="text-left">TT</td>
                                        <td>${sumVisitas}</td>
                                        <td class="val-col">${sumPosi}</td>
                                        <td class="perc-col">${calcPerc(sumPosi, sumVisitas)}</td>
                                        <td class="val-col">${sumFora}</td>
                                        <td class="perc-col">${calcPerc(sumFora, sumVisitas)}</td>
                                        <td class="val-col">${sumNaoPediu}</td>
                                        <td class="perc-col">${calcPerc(sumNaoPediu, sumVisitas)}</td>
                                        <td>${sumVisitas}</td>
                                        <td class="prod-final">${tProdRN}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        `;
                        
                        area.innerHTML += tableHTML;
                    }
                }

                initUI();
            </script>
        </body>
